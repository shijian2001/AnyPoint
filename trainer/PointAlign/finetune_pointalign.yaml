model:
  arch: minigpt_3d
  model_type: pretrain
  max_txt_len: 1024
  end_sym: "###"
  llama_model: "/path/to/model/pointalign/Phi_2"
  ckpt: "/path/to/model/pointalign/pointalign/pretrain.pth"
  pc_encoder_ckpt: "/path/to/model/pointalign/pc_encoder/point_model.pth"
  bert_model_path: "/path/to/model/pointalign/bert-base-uncased"
  blip2_pretrained: "/path/to/model/pointalign/blip2_pretrained_flant5xxl.pth"
  use_grad_checkpoint: True
  chat_template: True
  lora_r: 64
  lora_alpha: 16
  pc_linear_layer: 2
  QFormer_lora_r: 8
  QFormer_lora_alpha: 16
  train_QFormer_norm: True
  QFormer_lora_module: ["query", "key", "value"]
  freeze_Qformer: True
  align_qformer_to_llm: True

datasets:
  Objaverse_single_round:
    batch_size: 2
    text_processor:
      train:
        name: "blip_caption"
    sample_ratio: 1
    build_info:
      data_path: ./data/pointalign_train_data
      ann_path: ./data/anno_data/pointalign_train_single_round.json
      pointnum: 8192
      conversation_types: "single_round"
      use_color: True

run:
  task: image_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 3e-6
  min_lr: 1e-7
  warmup_lr: 1e-7
  weight_decay: 0.05
  num_workers: 4
  max_epoch: 1
  warmup_steps: 10
  iters_per_epoch: 20
  seed: 42
  output_dir: "./output/pointalign_train"
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
  wandb_log: False
  job_name: pointalign_train
