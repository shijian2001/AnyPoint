[project]
name = "shapellm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==0.21.0",
    "diskcache>=5.6.3",
    "easydict>=1.13",
    "einops>=0.8.2",
    "fire>=0.7.1",
    "huggingface-hub==0.14.1",
    "matplotlib>=3.10.9",
    "pointnet2-ops",
    "plyfile",
    "requests",
    "scikit-learn",
    "sentence-transformers==2.2.2",
    "sentencepiece",
    "setuptools<82",
    "timm>=1.0.26",
    "torch==2.9.0",
    "torchaudio==2.9.0",
    "torchvision==0.24.0",
    "transformers==4.31.0",
    "openai>=2.32.0",
    "qwen-vl-utils>=0.0.14",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
pointnet2-ops = { path = "../../../Pointnet2_PyTorch/pointnet2_ops_lib", editable = true }

[tool.uv.extra-build-dependencies]
pointnet2-ops = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
name = "tsinghua-pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
