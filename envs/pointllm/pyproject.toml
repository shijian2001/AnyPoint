[project]
name = "pointllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "accelerate>=1.10.1",
    "deepspeed>=0.18.8",
    "diskcache>=5.6.3",
    "easydict>=1.13",
    "einops>=0.8.2",
    "fastapi>=0.128.8",
    "fire>=0.7.1",
    "flash-attn",
    "ftfy==6.0.1",
    "gradio>=4.44.1",
    "h5py>=3.14.0",
    "huggingface-hub==0.25.2",
    "markdown2[all]>=2.5.5",
    "nltk>=3.9.2",
    "numpy<2",
    "open3d==0.16.0",
    "openai>=2.29.0",
    "opencv-python>=4.11.0.86",
    "peft>=0.17.1",
    "plyfile>=1.1.3",
    "py-rouge>=1.1",
    "qwen-vl-utils>=0.0.14",
    "regex>=2026.1.15",
    "requests>=2.32.5",
    "rouge>=1.0.1",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=2.2.2",
    "sentencepiece>=0.2.1",
    "shortuuid>=1.0.13",
    "termcolor>=3.1.0",
    "timm==0.4.12",
    "tokenizers==0.12.1",
    "torch==2.0.1",
    "torchaudio==2.0.2",
    "torchvision==0.15.2",
    "tqdm>=4.67.3",
    "transformers",
    "uvicorn>=0.39.0",
    "wandb>=0.25.1",
]




[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "cae78c46" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.6.3/flash_attn-2.6.3%2Bcu118torch2.0cxx11abiFALSE-cp39-cp39-linux_x86_64.whl" }
# CUDA 11.7 wheels have no sm_90 kernels -> fail on H800 ("no kernel image").
# cu118 (still runs on driver 550) adds Hopper support; torch version unchanged.
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
